plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wmmt.port'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.wmmt.port'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}


// Use the repository's existing artwork as the launcher icon; no new artwork is generated.
def originalLogoResDir = layout.buildDirectory.dir("generated/res/originalLogo")
tasks.register("copyOriginalLauncherLogo", Copy) {
    from("$rootDir/../docs/logo.png")
    into(originalLogoResDir.map { it.dir("drawable-nodpi") })
    rename { "ic_launcher.png" }
}
android.sourceSets.main.res.srcDir(originalLogoResDir)
tasks.named("preBuild").configure {
    dependsOn("copyOriginalLauncherLogo")
}
